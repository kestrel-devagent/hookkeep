name = "hookkeep"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Static dashboard + landing page served from the repo's existing public/
[assets]
directory = "../public"
binding = "ASSETS"

# Create with: wrangler kv namespace create HOOKKEEP_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "HOOKKEEP_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Optional vars
# [vars]
# HOOKKEEP_PUBLIC_URL = "https://hookkeep.<your-subdomain>.workers.dev"  # public base for webhookUrl responses
# BILLING_PUBLIC_URL = "https://<stripe-billing-host>"                 # makes /subscribe redirect to Stripe billing
# Prefer secrets for billing gate: wrangler secret put FULFILL_SECRET
# (alias HOOKKEEP_FULFILL_SECRET also accepted by the worker)
